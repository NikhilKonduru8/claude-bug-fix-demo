name: Claude Bug Detection & Auto-Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-review:
    name: Claude Code Review & Auto-Fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Get changed files
        id: diff
        run: |
          git diff origin/main...HEAD -- '*.py' > diff.txt
          cat diff.txt

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python << 'PYEOF'
          import anthropic
          import os
          import subprocess

          # Read the diff
          with open("diff.txt") as f:
              diff = f.read()

          if not diff.strip():
              print("No Python file changes found.")
              exit(0)

          # Call Claude
          client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
          message = client.messages.create(
              model="claude-opus-4-5",
              max_tokens=4096,
              messages=[
                  {
                      "role": "user",
                      "content": f"""You are a senior Python engineer doing a code review.

          Here is the git diff of the changes:
          {diff}

          Review this code and identify ALL bugs, security issues, and errors.
          For each issue found, list:
          - File name and line number
          - Severity (Critical / High / Medium / Low)
          - What the bug is
          - How to fix it

          Format your response as a clear markdown comment suitable for a GitHub PR."""
                  }
              ]
          )

          review = message.content[0].text
          print("Claude review:", review)

          # Post comment to PR
          pr_number = os.environ["PR_NUMBER"]
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          import urllib.request
          import json

          comment_body = f"## Claude Code Review\n\n{review}"
          data = json.dumps({"body": comment_body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          urllib.request.urlopen(req)
          print("Comment posted successfully!")
          PYEOF

name: AI Auto-Debugger
on: [push]

# ADD THIS SECTION:
permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required to checkout your code

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Claude Code Debugger
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Analyze the changes in this push. If you find any logic errors or bugs, explain how to fix them."

name: Claude Bug Detection & Auto-Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude-review:
    name: Claude Code Review & Auto-Fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai requests

      - name: Get changed files
        run: |
          git diff origin/main...HEAD -- '*.py' > diff.txt
          cat diff.txt

      - name: Run AI review and send email
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          python << 'PYEOF'
          import openai
          import os
          import json
          import urllib.request
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          # Read the diff
          with open("diff.txt") as f:
              diff = f.read()

          if not diff.strip():
              print("No Python file changes found.")
              exit(0)

          # Call OpenAI Codex
          client = openai.OpenAI(api_key=os.environ["OPENAI_API_KEY"])
          response = client.chat.completions.create(
              model="gpt-4o",
              max_tokens=4096,
              messages=[
                  {
                      "role": "system",
                      "content": "You are a senior Python engineer performing automated code reviews."
                  },
                  {
                      "role": "user",
                      "content": f"""Review this git diff and identify ALL bugs, security issues, and errors.

          For each issue found, list:
          - File name and line number
          - Severity (Critical / High / Medium / Low)
          - What the bug is
          - How to fix it

          Format your response as a clear markdown comment suitable for a GitHub PR.

          At the very end of your response, on its own line, write either:
          BUGS_FOUND: YES
          or
          BUGS_FOUND: NO

          Here is the diff:
          {diff}"""
                  }
              ]
          )

          review = response.choices[0].message.content
          print("Review:", review)

          # Post comment to PR
          pr_number = os.environ["PR_NUMBER"]
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          pr_url = os.environ["PR_URL"]
          pr_title = os.environ["PR_TITLE"]

          comment_body = f"## AI Code Review\n\n{review}"
          data = json.dumps({"body": comment_body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          urllib.request.urlopen(req)
          print("Comment posted successfully!")

          # Send email if bugs found
          if "BUGS_FOUND: YES" in review:
              print("Bugs found — sending email alert...")

              email_address = os.environ["EMAIL_ADDRESS"]
              email_password = os.environ["EMAIL_APP_PASSWORD"]
              to_email = "nikhilkonduru8@gmail.com"

              msg = MIMEMultipart("alternative")
              msg["Subject"] = f"🚨 AI found bugs in PR: {pr_title}"
              msg["From"] = email_address
              msg["To"] = to_email

              plain = f"""AI Code Review found bugs in a pull request.

          PR: {pr_title}
          Link: {pr_url}

          Review summary:
          {review}
          """

              html = f"""
              <html>
              <body style="font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto;">
                  <div style="background: #e53e3e; color: white; padding: 16px 24px; border-radius: 8px 8px 0 0;">
                  <h2 style="margin:0">�� AI Bug Detection Alert</h2>
                  </div>
                  <div style="border: 1px solid #e2e8f0; padding: 24px; border-radius: 0 0 8px 8px;">
                  <p><strong>Repository:</strong> {repo}</p>
                  <p><strong>PR:</strong> <a href="{pr_url}">{pr_title}</a></p>
                  <p><strong>Review findings:</strong></p>
                  <div style="background: #f7fafc; padding: 16px; border-radius: 6px; white-space: pre-wrap; font-size: 14px;">
                      {review.replace("BUGS_FOUND: YES", "").strip()}
                  </div>
                  <br>
                  <a href="{pr_url}" style="background:#3182ce; color:white; padding:10px 20px; border-radius:6px; text-decoration:none;">
                      View PR on GitHub
                  </a>
                  </div>
              </body>
              </html>
              """

              msg.attach(MIMEText(plain, "plain"))
              msg.attach(MIMEText(html, "html"))

              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
                  server.login(email_address, email_password)
                  server.sendmail(email_address, to_email, msg.as_string())

              print(f"Email alert sent to {to_email}!")
          else:
              print("No bugs found — no email sent.")
          PYEOF

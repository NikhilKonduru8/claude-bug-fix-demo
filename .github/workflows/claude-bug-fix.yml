name: AI Auto-Debugger
on: [push]

# Permissions must be siblings of 'name' and 'on'
permissions:
  id-token: write   # CRITICAL: This allows the Anthropic OIDC handshake
  contents: read    # Allows the agent to read your code
  pull-requests: write # Allows the agent to comment on PRs
  issues: write     # Allows the agent to comment on issues

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Claude Code Debugger
        uses: anthropics/claude-code-action@v1
        with:
          # This should match the Secret name you created in GitHub Settings
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Analyze the latest changes. Find bugs and explain how to fix them."

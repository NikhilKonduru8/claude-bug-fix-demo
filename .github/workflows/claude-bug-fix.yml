name: AI Auto-Debugger
on: [push] # Triggers on every push

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Claude Code Debugger
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # This tells Claude what to do when it wakes up
          prompt: "Analyze the changes in this push. If you find any logic errors or bugs, comment on the commit and explain how to fix them."
